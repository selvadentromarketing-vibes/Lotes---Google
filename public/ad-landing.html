<script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript" async></script>

<script>
(function() {
  var modal = document.getElementById('scheduler-modal');
  var openers = document.querySelectorAll('[data-open-scheduler]');
  var closers = document.querySelectorAll('[data-close-scheduler]');
  var lastFocus = null;

  function openModal() {
    lastFocus = document.activeElement;
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    var closeBtn = modal.querySelector('.modal-close');
    if (closeBtn) closeBtn.focus({ preventScroll: true });
    if (typeof window.fbq === 'function') { window.fbq('track', 'Lead'); }
  }

  function closeModal() {
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocus && typeof lastFocus.focus === 'function') {
      lastFocus.focus({ preventScroll: true });
    }
  }

  openers.forEach(function(b) { b.addEventListener('click', openModal); });
  closers.forEach(function(b) { b.addEventListener('click', closeModal); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.getAttribute('aria-hidden') === 'false') closeModal();
  });

  document.querySelectorAll('[data-track-cta]').forEach(function(el) {
    el.addEventListener('click', function() {
      if (typeof window.fbq === 'function') { window.fbq('track', 'Lead'); }
    });
  });
})();
</script>
